<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>סיור בבית הכנסת יוסף שלום</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif;touch-action:none}#hud{position:fixed;top:8px;right:8px;color:#fff;background:#0008;padding:8px 12px;border-radius:8px;font-size:14px;pointer-events:none}#joy{position:fixed;left:24px;bottom:24px;width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff5;display:none}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fff8}#reset{position:fixed;bottom:16px;right:16px;z-index:5;font-size:15px;padding:8px 14px;border-radius:8px;border:0;background:#fffd;cursor:pointer}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<div id="load">טוען… <span id="pct"></span></div>
<div id="hud">גרירה: הסתכלות · WASD/חצים: הליכה · גלגלת: קדימה/אחורה · R: חזרה לכניסה<br>במובייל: ג'ויסטיק משמאל, גרירה להסתכלות</div>
<button id="reset">חזרה לכניסה</button>
<div id="joy"><div id="knob"></div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const EYE=1.6,R=0.3,SPEED=2.2;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfd4e6);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x887766,1.2));const sun=new THREE.DirectionalLight(0xfff2dd,1.5);sun.position.set(-5,10,4);scene.add(sun);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,500);cam.rotation.order='YXZ';
let yaw=0,pitch=0;const meshes=[];const ray=new THREE.Raycaster();
const dl=new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
new GLTFLoader().setDRACOLoader(dl).load('synagogue.glb',g=>{
  scene.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){meshes.push(o);const m=o.material;if(m&&m.transparent)o.userData.glass=true;}});
  scene.updateMatrixWorld(true);computeSpawn(g.scene);goSpawn();document.getElementById('load').remove();
},e=>{if(e.total)document.getElementById('pct').textContent=Math.round(e.loaded/e.total*100)+'%'});
// spawn
let SP=null,SPY=0;const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function find(root,re){let o=null;root.traverse(n=>{if(!o&&re.test(n.name||''))o=n});return o}
function clearance(p,maxd){let m=maxd;for(const h of [0.4,1.0,1.5])for(let i=0;i<16;i++){const a=i/16*Math.PI*2;ray.set(V(p.x,p.y+h,p.z),V(Math.cos(a),0,Math.sin(a)));ray.far=maxd;const x=ray.intersectObjects(meshes,false)[0];if(x)m=Math.min(m,x.distance)}return m}
function floorAt(x,z,top){ray.set(V(x,top,z),V(0,-1,0));ray.far=1e4;const hs=ray.intersectObjects(meshes,false);
  // first hit below 2.4m above the lowest floor-ish surface: walk hits top-down, take first one whose up-normal is horizontal surface with >=2.2m free above
  for(let i=0;i<hs.length;i++){const h=hs[i];const n=h.face?h.face.normal.clone().transformDirection(h.object.matrixWorld):V(0,1,0);if(n.y<0.7)continue;const above=i>0?hs[i-1].point.y-h.point.y:99;if(above>=2.2)return {y:h.point.y,name:h.object.name||''}}return null}
function computeSpawn(root){
  const ark=find(root,/Aron Kodesh|^NEW Ark/i),ent=find(root,/Entrance target/i);
  const ab=ark?new THREE.Box3().setFromObject(ark):null;const A=ab?ab.getCenter(V()):V(12.5,0,-4.5);
  const E=ent?ent.getWorldPosition(V()):V(6.9,0,-11.95);
  const fl=[];root.traverse(o=>{if(o.isMesh&&/porcelain floor/i.test((o.name||'')+(o.parent&&o.parent.name||'')))fl.push(o)});
  const fb=new THREE.Box3();fl.length?fl.forEach(o=>fb.expandByObject(o)):fb.setFromObject(root);
  const top=new THREE.Box3().setFromObject(root).max.y+1;let best=null;
  for(let x=fb.min.x+0.3;x<fb.max.x;x+=0.5)for(let z=fb.min.z+0.3;z<fb.max.z;z+=0.5){
    if(ab&&ab.clone().expandByScalar(1.5).containsPoint(V(x,ab.min.y+0.1,z)))continue;
    const f=floorAt(x,z,top);if(!f||(fl.length&&f.y>fb.max.y+0.6))continue;const p=V(x,f.y,z);
    const c=clearance(p,1.2);if(c<0.6)continue;
    const sc=-Math.hypot(x-E.x,z-E.z)+0.4*Math.hypot(x-A.x,z-A.z)+0.5*Math.min(c,1.2);
    if(!best||sc>best.s)best={s:sc,p}}
  if(best){SP=best.p;}else{SP=V(E.x,fb.min.y,E.z);}SPY=Math.atan2(-(A.x-SP.x),-(A.z-SP.z));
  console.log('spawn',SP,'ark',A,'entrance',E);
}
function goSpawn(){cam.position.set(SP.x,SP.y+EYE,SP.z);yaw=SPY;pitch=0}
function stuck(){let n=0,back=0;for(let i=0;i<8;i++){const a=i/8*Math.PI*2;ray.set(V(cam.position.x,cam.position.y-0.6,cam.position.z),V(Math.cos(a),0,Math.sin(a)));ray.far=0.3;const h=ray.intersectObjects(meshes,false)[0];if(h){n++;if(h.face&&h.face.normal.clone().transformDirection(h.object.matrixWorld).dot(ray.ray.direction)>0)back++}}return n>=6||back>=3}
let stuckT=0;addEventListener('keydown',e=>{if(e.code==='KeyR'&&SP)goSpawn()});
document.getElementById('reset').addEventListener('click',()=>{if(SP)goSpawn()});
// look
let drag=null;const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.clientX<innerWidth/2&&joyOn)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-= (e.clientX-drag.x)*0.004;pitch-=(e.clientY-drag.y)*0.004;pitch=Math.max(-1.4,Math.min(1.4,pitch));drag.x=e.clientX;drag.y=e.clientY});
el.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId)drag=null});
// keys & wheel
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
let wheel=0;addEventListener('wheel',e=>{wheel+=-Math.sign(e.deltaY)*0.5;e.preventDefault()},{passive:false});
// joystick
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let joyOn=matchMedia('(pointer:coarse)').matches,jv={x:0,y:0},jid=null;
if(joyOn)joy.style.display='block';
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jmove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
joy.addEventListener('pointerup',e=>{jid=null;jv={x:0,y:0};knob.style.left=knob.style.top='35px'});
function jmove(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-60)/50,y=(e.clientY-r.top-60)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jv={x,y};knob.style.left=35+x*50+'px';knob.style.top=35+y*50+'px'}
// collision
const tmp=new THREE.Vector3();
function blocked(dir,dist){for(const h of [-0.9,-0.4,0.2]){ray.set(tmp.copy(cam.position).add(new THREE.Vector3(0,h,0)),dir);ray.far=dist+R;const hit=ray.intersectObjects(meshes,false)[0];if(hit)return true}return false}
function tryMove(v){const d=v.length();if(d<1e-6)return;for(const ax of [v.clone(),new THREE.Vector3(v.x,0,0),new THREE.Vector3(0,0,v.z)]){const l=ax.length();if(l<1e-6)continue;if(!blocked(ax.clone().normalize(),l)){cam.position.add(ax);return}}}
function ground(){ray.set(tmp.copy(cam.position).add(new THREE.Vector3(0,-1.0,0)),new THREE.Vector3(0,-1,0));ray.far=3;const h=ray.intersectObjects(meshes,false)[0];if(h){const t=h.point.y+EYE;cam.position.y+= (t-cam.position.y)*0.3}}
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),0.05);cam.rotation.set(pitch,yaw,0);
  let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jv.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jv.x;
  const fw=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),rt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const v=fw.multiplyScalar(f*SPEED*dt).add(rt.multiplyScalar(s*SPEED*dt));
  if(wheel){const w=Math.sign(wheel)*Math.min(Math.abs(wheel),4*dt);wheel-=w;v.add(new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)).multiplyScalar(w))}
  if(meshes.length&&SP){if(stuck()){stuckT+=dt;cam.position.add(v);if(stuckT>1.5){goSpawn();stuckT=0}}else{stuckT=0;tryMove(v)}ground()}renderer.render(scene,cam)});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
